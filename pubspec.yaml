name: purchase_ledger
description: "Offline-first purchase and supplier ledger for retail businesses."
publish_to: 'none'
version: 2.0.0+6

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  sqflite: ^2.4.1
  path: ^1.9.0
  intl: ^0.20.3
  pdf: ^3.13.0
  pdf_text_shaper: ^1.1.1
  printing: ^5.15.1
  image_picker: ^1.2.4
  path_provider: ^2.1.5
  crypto: ^3.0.6
  share_plus: ^11.1.0
  cross_file: ^0.3.5+5
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: false
  assets:
    - assets/fonts/NotoSansArabic.ttf
    - assets/branding/app_icon.png
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
